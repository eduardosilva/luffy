name: Monitor API 

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar pacotes
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Dar permissão ao script
        run: chmod +x check_api.sh

      - name: Executar verificação da API
        env:
          API_KEY: ${{ secrets.API_KEY }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: ./check_api.sh -p $(date +%Y-%m)
