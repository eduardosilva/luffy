name: IDM Load Test

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check-api:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar pacotes
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Dar permissão ao script
        run: chmod +x check_api.sh

      - name: Executar teste de carga do IDM
        env:
          API_KEY: ${{ secrets.API_KEY }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
        run: |
          for iteration in $(seq 1 60); do
            echo "Executando requisição ${iteration}/60"
            ./check_api.sh -p "$(date +%Y-%m)"

            if [ "$iteration" -lt 60 ]; then
              sleep 5
            fi
          done
